{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-8">
        <h2 class="text-xl font-semibold text-gray-800 mb-6">Nouvelle etude de marche</h2>

        <form hx-post="/api/generate" hx-target="#results" hx-indicator="#loading" class="space-y-5">
            <div>
                <label for="client" class="block text-sm font-medium text-gray-700 mb-1">Client</label>
                <input type="text" id="client" name="client" required
                    placeholder="Ex: L'Oreal, Airbus, Schneider Electric"
                    class="w-full px-4 py-2.5 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            </div>

            <div>
                <label for="sector" class="block text-sm font-medium text-gray-700 mb-1">Secteur</label>
                <input type="text" id="sector" name="sector" required
                    placeholder="Ex: Cosmetique, Aeronautique, Energie"
                    class="w-full px-4 py-2.5 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            </div>

            <div>
                <label for="geography" class="block text-sm font-medium text-gray-700 mb-1">Geographie</label>
                <input type="text" id="geography" name="geography" required
                    placeholder="Ex: France, Europe, Amerique du Nord"
                    class="w-full px-4 py-2.5 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            </div>

            <button type="submit"
                class="w-full bg-blue-600 text-white py-3 px-6 rounded-md font-medium hover:bg-blue-700 transition cursor-pointer">
                Generer l'etude
            </button>
        </form>
    </div>

    <div id="loading" class="htmx-indicator mt-6 text-center">
        <div class="inline-flex items-center gap-2 text-gray-500">
            <svg class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
            <span>Recherche en cours...</span>
        </div>
    </div>

    <div id="results" class="mt-6"></div>
</div>
{% endblock %}
